<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Materia Naranja</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');
    :root{--p:#ff6338;--p-dim:#6b2a18;--p-hi:#ffaa55;--p-glow:rgba(255,99,56,0.35);--bg:#060200}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden}
    body{background:var(--bg);font-family:'Space Mono',monospace;color:var(--p)}
    body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(0,0,0,.13) 2px,rgba(0,0,0,.13) 4px);pointer-events:none;z-index:50}
    .noise{position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.06'/%3E%3C/svg%3E");background-size:180px;opacity:.35;mix-blend-mode:screen;animation:nS .12s steps(1) infinite;pointer-events:none;z-index:1}
    @keyframes nS{0%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,2px)}100%{transform:translate(1px,-2px)}}
    .ghost{position:fixed;inset:0;padding:80px 40px 40px;font-size:clamp(6px, 0.85vw, 10px);line-height:2;color:rgba(160,60,30,.45);letter-spacing:.08em;pointer-events:none;z-index:2;overflow:hidden;mask-image:radial-gradient(ellipse at 50% 50%,transparent 25%,black 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 50%,transparent 25%,black 75%)}
    #cv{position:fixed;inset:0;pointer-events:none;z-index:15}
    .topbar{position:fixed;top:0;left:0;right:0;height:112px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;z-index:40;border-bottom:1px solid rgba(107,42,24,.2);background:linear-gradient(to bottom,rgba(6,2,0,.95),rgba(6,2,0,.7))}
    .topbar img{height:104px;opacity:1;filter:none;mix-blend-mode:screen;}
    .hbg{display:flex;flex-direction:column;justify-content:center;gap:5px;width:28px;height:28px;cursor:pointer;background:none;border:none;padding:2px}
    .hbg span{display:block;height:1.5px;width:100%;background:var(--p-dim);box-shadow:0 0 4px var(--p-dim);transition:all .25s}
    .hbg:hover span{background:var(--p);box-shadow:0 0 6px var(--p)}
    .hbg.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
    .hbg.open span:nth-child(2){opacity:0;transform:scaleX(0)}
    .hbg.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}
    .nav{position:fixed;top:56px;right:0;bottom:0;width:220px;background:rgba(4,1,0,.97);border-left:1px solid rgba(107,42,24,.3);z-index:39;display:flex;flex-direction:column;padding:24px 0;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);pointer-events:none}
    .nav.open{transform:translateX(0);pointer-events:all}
    .ni{padding:12px 28px;color:var(--p-dim);font-size:clamp(8px, 1.05vw, 10px);letter-spacing:.15em;text-decoration:none;cursor:pointer;transition:color .15s,padding-left .15s;border-left:2px solid transparent}
    .ni:hover{color:var(--p);text-shadow:0 0 6px var(--p);padding-left:34px;border-left-color:var(--p)}
    .nd{height:1px;margin:10px 28px;background:var(--p-dim);opacity:.2}
    .stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;z-index:20;padding:112px 40px 40px;pointer-events:none}
    .stage>*{pointer-events:all}
    .page{display:none;flex-direction:column;align-items:center;gap:24px;width:100%;max-width:760px}
    .page.active{display:flex;animation:fi .5s ease forwards}
    @keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .sentence{font-size:clamp(14px, 2.25vw, 26px);text-align:center;line-height:2.2;text-shadow:0 0 8px var(--p),0 0 18px var(--p-glow);user-select:none}
    .isel{position:relative;display:inline-block;cursor:default}
    .isel-label{color:var(--p-hi);text-shadow:0 0 8px var(--p-hi),0 0 18px rgba(255,170,80,.3);border-bottom:1px solid rgba(255,170,80,.35);white-space:nowrap;transition:color .15s,text-shadow .15s}
    .isel.ah .isel-label{color:#fff;text-shadow:0 0 10px #fff,0 0 22px var(--p-hi);border-bottom-color:rgba(255,255,255,.5)}
    .im{display:none;position:fixed;z-index:9999;background:rgba(4,1,0,.98);border:1px solid var(--p-dim);box-shadow:0 4px 24px rgba(255,80,56,.15),inset 0 0 16px rgba(0,0,0,.6);padding:4px 0;min-width:max-content}
    .im.open{display:block;animation:mi .15s ease forwards}
    @keyframes mi{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
    .ii{display:block;padding:8px 20px;color:var(--p-dim);font-family:'Space Mono',monospace;font-size:clamp(8px, 1.15vw, 12px);letter-spacing:.05em;white-space:nowrap;cursor:pointer;transition:color .1s,background .1s}
    .ii:hover{color:var(--p-hi);background:rgba(255,99,56,.07);text-shadow:0 0 6px var(--p-hi)}
    .ii.sel{color:var(--p);text-shadow:0 0 5px var(--p)}
    .cbt{background:transparent;border:1px solid var(--p-dim);color:var(--p-dim);font-family:'Space Mono',monospace;font-size:clamp(6px, 0.95vw, 10px);letter-spacing:.2em;padding:8px 26px;cursor:pointer;text-shadow:0 0 4px var(--p-dim);transition:all .2s}
    .cbt:hover{color:var(--p);border-color:var(--p);text-shadow:0 0 8px var(--p);box-shadow:0 0 14px var(--p-glow)}
    .sh{font-size:clamp(6px, 0.85vw, 8px);color:var(--p-dim);letter-spacing:.22em;text-shadow:0 0 5px var(--p-dim);text-align:center}
    .st{font-size:clamp(12px, 2.05vw, 24px);color:var(--p);text-align:center;line-height:1.5;text-shadow:0 0 8px var(--p),0 0 20px var(--p-glow);max-width:640px}
    .sb{font-size:clamp(8px, 1.15vw, 12px);color:var(--p-dim);text-align:center;letter-spacing:.07em;line-height:1.9;max-width:520px;text-shadow:0 0 4px var(--p-dim)}
    .sd{width:48%;height:1px;background:var(--p-dim);opacity:.25}
    .bb{background:transparent;border:none;color:var(--p-dim);font-family:'Space Mono',monospace;font-size:clamp(6px, 0.85vw, 8px);letter-spacing:.18em;cursor:pointer;text-shadow:0 0 4px var(--p-dim);transition:color .15s;padding:4px 0}
    .bb:hover{color:var(--p);text-shadow:0 0 8px var(--p)}
    .cur{display:inline-block;width:.55em;height:1em;background:var(--p);box-shadow:0 0 8px var(--p),0 0 16px var(--p-glow);margin-left:4px;vertical-align:text-bottom;animation:bl 1.1s step-start infinite}
    @keyframes bl{0%,100%{opacity:1}50%{opacity:0}}
    /* hide main UI during boot */
    .topbar,.stage,#cv,.noise,.ghost{opacity:0;transition:opacity .8s ease .2s}
    body.booted .topbar,body.booted .stage,body.booted #cv,body.booted .noise,body.booted .ghost{opacity:1}
    /* CRT layers */
    .crt-scan{position:absolute;inset:0;pointer-events:none;z-index:40;background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(0,0,0,.22) 2px,rgba(0,0,0,.22) 4px)}
    .crt-noise{position:absolute;inset:0;pointer-events:none;z-index:21;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.06'/%3E%3C/svg%3E");background-size:180px;opacity:.4;mix-blend-mode:screen;animation:nS .12s steps(1) infinite}
    .crt-vign{position:absolute;inset:0;pointer-events:none;z-index:22;background:radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(0,0,0,.88) 100%)}
    .crt-bloom{position:absolute;inset:0;pointer-events:none;z-index:19;background:radial-gradient(ellipse at 50% 42%,rgba(255,99,56,.07) 0%,transparent 65%)}
    /* PAK */
    #pak{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;align-items:center;justify-content:center;cursor:pointer}
    #pak-text{position:relative;z-index:30;font-family:'Space Mono',monospace;font-size:clamp(10px, 1.45vw, 16px);letter-spacing:.28em;color:var(--p);text-shadow:0 0 8px var(--p),0 0 22px var(--p-glow),0 0 45px rgba(255,99,56,.2)}
    /* BOOT */
    #boot{position:fixed;inset:0;background:var(--bg);z-index:999;display:none;flex-direction:column;justify-content:center;padding:10vh 8vw;overflow:hidden}
    #boot-out{position:relative;z-index:30;font-family:'Space Mono',monospace;font-size:clamp(8px, 1.25vw, 14px);line-height:1.85;letter-spacing:.06em;white-space:pre-wrap;color:var(--p);text-shadow:0 0 6px var(--p),0 0 18px var(--p-glow),0 0 35px rgba(255,99,56,.18)}
    #boot-logo{position:relative;z-index:30;margin-bottom:3vh}
    #boot-logo img{height:clamp(55px,8vh,95px);width:auto;display:block}
    #boot-logo .boot-tagline{font-family:'Space Mono',monospace;font-size:clamp(7px,0.8vw,9px);color:var(--p-dim);letter-spacing:.32em;margin-top:3px;text-shadow:0 0 4px var(--p-dim)}
  </style>
</head>

document.addEventListener('DOMContentLoaded', function(){
(function(){
  let actx=null;
  function initAudio(){
    if(actx)return;
    try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
  }
  function click(vol){
    vol=vol||0.18;
    if(!actx)return;
    try{
      const b=actx.createBuffer(1,Math.floor(actx.sampleRate*.014),actx.sampleRate);
      const d=b.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,4)*vol;
      const s=actx.createBufferSource(),g=actx.createGain();
      s.buffer=b;g.gain.value=1;s.connect(g);g.connect(actx.destination);s.start();
    }catch(e){}
  }
  function beep(freq,dur,vol){
    vol=vol||0.1;
    if(!actx)return;
    try{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type='square';o.frequency.value=freq;
      g.gain.setValueAtTime(vol,actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur);
      o.connect(g);g.connect(actx.destination);
      o.start();o.stop(actx.currentTime+dur+.02);
    }catch(e){}
  }

  const pak    = document.getElementById('pak');
  const pakTxt = document.getElementById('pak-text');
  const boot   = document.getElementById('boot');
  const out    = document.getElementById('boot-out');

  // Initialise audio eagerly on any early user gesture (mousemove, etc.)
  function earlyAudio(){initAudio();}
  window.addEventListener('mousemove', earlyAudio, {once:true});
  window.addEventListener('touchstart', earlyAudio, {once:true});

  // PAK visible from start — auto-triggers after 5s
  pak.style.display='flex';
  pakTxt.textContent='PRESS ANY KEY TO START';

  var blinkOn=true;
  var blinkIv=setInterval(function(){
    blinkOn=!blinkOn;
    pakTxt.style.opacity=blinkOn?'1':'0';
  },550);

  // Auto-fire after 5 seconds
  var idleTimer=setTimeout(startBoot, 5000);

  function startBoot(){
    clearTimeout(idleTimer);
    clearInterval(blinkIv);
    initAudio();
    // Only beep if audio context is already running (i.e. user interacted)
    if(actx && actx.state==='running') beep(660,.06,.12);
    pak.style.transition='opacity .25s';
    pak.style.opacity='0';
    setTimeout(function(){
      pak.style.display='none';
      boot.style.display='flex';
      runBoot();
    },270);
  }

  pak.addEventListener('click', startBoot, {once:true});
  window.addEventListener('keydown', startBoot, {once:true});

  const LINES=[
    {t:'instant', text:'Copyright (c) 1987 MN Systems. All rights reserved.\n'},
    {t:'fast',    text:'Initializing phosphor subsystem.......... OK'},
    {t:'fast',    text:'Loading innovation kernel................. OK'},
    {t:'fast',    text:'Mounting cultural drives.................. OK'},
    {t:'fast',    text:'Checking process integrity................ OK'},
    {t:'bar',     text:'Cargando modulos de innovacion:  '},
    {t:'fast',    text:'\nSistema listo. Bienvenido.\n'},
    {t:'type',    text:'Me gustaria '},
    {t:'sel',     text:'innovar'},
    {t:'type',    text:' y '},
    {t:'sel',     text:'no se por donde empezar'},
  ];

  var content='';
  function setOut(s){out.textContent=s;}

  function animBar(prefix,cb){
    var n=0,total=32;
    beep(440,.08,.07);
    var iv=setInterval(function(){
      n++;
      var bar='',i;
      for(i=0;i<n;i++)bar+='█';
      for(i=n;i<total;i++)bar+='░';
      setOut(content+prefix+bar+' '+Math.floor(n/total*100)+'%');
      if(n%4===0)beep(300+n*14,.04,.05);
      if(n>=total){
        clearInterval(iv);
        content+=prefix+bar+' 100%\n';
        beep(880,.18,.1);
        setTimeout(cb,140);
      }
    },42);
  }

  function typeText(text,isSel,cb){
    var i=0,base=content;
    function next(){
      if(i>=text.length){
        content=base+(isSel?'['+text+']':text);
        cb();return;
      }
      click(isSel?.24:.16);
      i++;
      var partial=text.slice(0,i);
      setOut(content+(isSel?'['+partial+']':partial)+'_');
      var ch=text[i-1];
      var delay=ch===' '?18:(28+Math.random()*55);
      setTimeout(next,delay);
    }
    next();
  }

  function runLine(idx,cb){
    var l=LINES[idx];
    if(!l){cb();return;}
    if(l.t==='instant'){
      content+=l.text+'\n';
      beep(l.text.charAt(0)==='M'?660:480,.05,.07);
      setOut(content);
      setTimeout(cb,90);
    }else if(l.t==='fast'){
      content+=l.text+'\n';
      setOut(content);
      beep(520,.04,.05);
      setTimeout(cb,55+Math.random()*75);
    }else if(l.t==='bar'){
      animBar(l.text,cb);
    }else if(l.t==='type'){
      typeText(l.text,false,cb);
    }else if(l.t==='sel'){
      typeText(l.text,true,cb);
    }
  }

  function runBoot(){
    var li=0;
    function next(){
      if(li>=LINES.length){
        // Flash and hand off to main UI
        setTimeout(function(){
          var f=0;
          var fl=setInterval(function(){
            boot.style.opacity=f%2===0?'0.25':'1';
            beep(f%2===0?220:440,.08,.1);
            f++;
            if(f>5){
              clearInterval(fl);
              boot.style.opacity='1';
              boot.style.transition='opacity .55s ease';
              setTimeout(function(){
                boot.style.opacity='0';
                document.body.classList.add('booted');
                setTimeout(function(){boot.style.display='none';},600);
              },180);
            }
          },110);
        },700);
        return;
      }
      runLine(li,function(){li++;next();});
    }
    next();
  }

})();
}); // DOMContentLoaded

// Normalise to NMAX — extras cluster invisibly near real points
function norm(pts){
  const out=pts.map(p=>({...p}));
  let i=0;
  while(out.length<NMAX){
    const src=out[i%pts.length];
    out.push({x:src.x+(Math.random()-.5)*1.5,y:src.y+(Math.random()-.5)*1.5});
    i++;
  }
  return out;
}

// Design space is 800x800 centred at 400,400 → map to screen
function toScreen(x,y,W,H){
  const s=Math.min(W,H)/800*0.88;
  return{sx:W/2+(x-400)*s,sy:H/2+(y-400)*s};
}

let curKey='innovar-nosepordo';
let fromPts=norm(SHAPES[curKey]);
let toPts=fromPts.map(p=>({...p}));
let morphT=1,rot=0;

function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}

function triggerMorph(key){
  if(!SHAPES[key]||key===curKey)return;
  const e=ease(Math.min(morphT,1));
  fromPts=fromPts.map((p,i)=>({x:p.x+(toPts[i].x-p.x)*e,y:p.y+(toPts[i].y-p.y)*e}));
  toPts=norm(SHAPES[key]);
  curKey=key;morphT=0;
}

function render(){
  requestAnimationFrame(render);
  const W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);
  rot+=0.003;
  if(morphT<1)morphT+=0.01;
  const e=ease(Math.min(morphT,1));
  const cr=Math.cos(rot*0.5),sr=Math.sin(rot*0.5);
  const n=SHAPES[curKey].length;

  for(let i=0;i<NMAX;i++){
    const p=fromPts[i],q=toPts[i];
    let x=p.x+(q.x-p.x)*e;
    let y=p.y+(q.y-p.y)*e;
    const dx=x-400,dy=y-400;
    const rx=dx*cr-dy*0.05*sr;
    const ry=dy+dx*0.05*sr;
    const{sx,sy}=toScreen(400+rx,400+ry,W,H);
    const real=i<n;
    ctx.beginPath();
    ctx.arc(sx,sy,real?1.6:0.6,0,Math.PI*2);
    // very dim: real points rgba(210,80,48,0.45), extras almost invisible
    ctx.fillStyle=real?'rgba(210,80,48,0.45)':'rgba(110,38,20,0.08)';
    ctx.fill();
  }
}
requestAnimationFrame(render);

const cont={innovar:{nosepordo:{h:'// DIAGNÓSTICO INICIAL //',t:'Quieres innovar y no sabes por dónde empezar',b:'El primer paso es siempre una conversación.\nAnalizamos tu punto de partida, tu sector y\ntus capacidades para diseñar un mapa de ruta juntos.\n\n→ Sesión de diagnóstico gratuita disponible.'},formacion:{h:'// FORMACIÓN EN INNOVACIÓN //',t:'Quieres innovar y apostar por la formación',b:'Programas formativos a medida: desde talleres\nde Design Thinking hasta itinerarios completos\nde innovación para equipos y directivos.\n\n→ Catálogo de programas disponible.'},evento:{h:'// EVENTOS DE INNOVACIÓN //',t:'Quieres innovar y empezar con un evento',b:'Hackathons, jornadas de ideación, innovation days...\nDiseñamos experiencias que activan equipos\ny generan ideas accionables desde el primer día.\n\n→ Solicita una propuesta de evento.'},procesos:{h:'// PROCESOS Y METODOLOGÍA //',t:'Quieres innovar y necesitas procesos sólidos',b:'Auditamos cómo innova tu organización hoy\ny diseñamos sistemas, métricas y flujos de trabajo\nque hacen la innovación repetible y escalable.\n\n→ Descarga nuestro framework de diagnóstico.'},cultura:{h:'// TRANSFORMACIÓN CULTURAL //',t:'Quieres innovar y cambiar la cultura',b:'La cultura se cambia desde los comportamientos.\nTrabajamos con líderes y equipos para instalar\nnuevos hábitos, mentalidades y formas de trabajar.\n\n→ Hablemos de tu contexto organizativo.'}},impulsar:{nosepordo:{h:'// PUNTO DE PARTIDA //',t:'Impulsar la innovación, sin saber aún cómo',b:'Identificamos las palancas de innovación de tu organización:\ntecnología, talento, procesos o cultura.\nY priorizamos las de mayor impacto.\n\n→ Agenda una sesión de exploración.'},formacion:{h:'// FORMACIÓN ESTRATÉGICA //',t:'Impulsar la innovación desde la formación',b:'Programas para líderes de innovación: OKRs,\ninteligencia artificial aplicada, open innovation\ny gestión de portfolios de ideas.\n\n→ Consulta el programa ejecutivo.'},evento:{h:'// CATALIZADORES //',t:'Impulsar la innovación con un evento detonador',b:'Un evento bien diseñado puede cambiar la narrativa\ninterna de tu empresa en 48 horas.\nCreamos el contexto para que ocurra.\n\n→ Ver casos de éxito de eventos pasados.'},procesos:{h:'// SISTEMAS DE INNOVACIÓN //',t:'Impulsar la innovación con análisis y procesos',b:'Construimos el sistema operativo de innovación\nde tu empresa: desde la captación de ideas\nhasta la comercialización de proyectos.\n\n→ Descarga el modelo de madurez innovadora.'},cultura:{h:'// CAMBIO CULTURAL //',t:'Impulsar la innovación transformando la cultura',b:'Acompañamos procesos de cambio cultural\ncon metodologías probadas y medición\nde indicadores de comportamiento innovador.\n\n→ Solicita nuestro estudio de caso.'}},mejorar:{nosepordo:{h:'// MEJORA CONTINUA //',t:'Mejorar cómo innováis, sin saber por dónde',b:'Hacemos una radiografía de vuestro proceso actual\ny detectamos cuellos de botella, fricciones\ny oportunidades de mejora rápida.\n\n→ Solicita el diagnóstico de innovación.'},formacion:{h:'// CAPACITACIÓN DE EQUIPOS //',t:'Mejorar cómo innováis desde la formación',b:'Formación práctica en metodologías ágiles,\nprototipado rápido y validación de hipótesis\npara equipos que ya innovan pero quieren hacerlo mejor.\n\n→ Ver itinerarios de capacitación.'},evento:{h:'// EVENTOS DE MEJORA //',t:'Mejorar cómo innováis con un evento',b:'Sprints de innovación de 2-3 días donde\nel equipo trabaja sobre retos reales de la empresa\ny sale con prototipos testados y un plan de acción.\n\n→ Diseñemos vuestro próximo sprint.'},procesos:{h:'// OPTIMIZACIÓN DE PROCESOS //',t:'Mejorar cómo innováis con nuevos procesos',b:'Rediseñamos vuestro pipeline de innovación:\nstage-gates, portfolios, gobernanza y KPIs\nadaptados a vuestro sector y tamaño.\n\n→ Consulta nuestro servicio de innovation ops.'},cultura:{h:'// EVOLUCIÓN CULTURAL //',t:'Mejorar cómo innováis cambiando la cultura',b:'Cuando los procesos están pero la cultura los bloquea,\ntrabajamos con líderes y mandos intermedios\npara alinear comportamientos con la estrategia.\n\n→ Hablemos de liderazgo innovador.'}},crear:{nosepordo:{h:'// NUEVOS HORIZONTES //',t:'Crear nuevos productos o servicios, sin mapa',b:'Te ayudamos a explorar nuevos espacios de oportunidad,\nvalidar ideas con usuarios reales y construir\nlos primeros MVPs de forma ágil y económica.\n\n→ Empieza con un taller de oportunidades.'},formacion:{h:'// INNOVACIÓN DE PRODUCTO //',t:'Crear nuevos productos o servicios desde la formación',b:'Formación en Design Thinking, Lean Startup\ny Jobs-to-be-done para equipos de producto,\nmarketing e innovación.\n\n→ Ver programa de innovación de producto.'},evento:{h:'// GENERACIÓN DE IDEAS //',t:'Crear nuevos productos o servicios con un evento',b:'Ideathons y talleres de innovación abierta\ndonde generáis y filtráis cientos de ideas\nen un solo día con metodología robusta.\n\n→ Diseña tu próximo ideathon.'},procesos:{h:'// PIPELINE DE PRODUCTO //',t:'Crear nuevos productos con análisis y procesos',b:'Construimos el proceso de descubrimiento,\nvalidación y desarrollo de nuevas ofertas\nadaptado a vuestra capacidad y mercado.\n\n→ Solicita nuestra metodología de producto.'},cultura:{h:'// CULTURA DE PRODUCTO //',t:'Crear nuevos productos cambiando la cultura',b:'Para crear productos nuevos se necesita tolerancia\nal error y mentalidad de experimento.\nAyudamos a instalar esos valores en los equipos.\n\n→ Conoce nuestro programa de cultura de producto.'}},fomentar:{nosepordo:{h:'// CULTURA INNOVADORA //',t:'Fomentar la cultura innovadora, sin saber cómo',b:'La cultura innovadora no se decreta, se cultiva.\nComenzamos por entender vuestra cultura actual\ny diseñar intervenciones de alto impacto.\n\n→ Solicita el diagnóstico de cultura innovadora.'},formacion:{h:'// MENTALIDAD INNOVADORA //',t:'Fomentar la cultura innovadora desde la formación',b:'Programas de mindset innovador: gestión de la ambigüedad,\npensamiento lateral, colaboración\ny liderazgo del cambio para todos los niveles.\n\n→ Ver programa de cultura e innovación.'},evento:{h:'// EVENTOS CULTURALES //',t:'Fomentar la cultura innovadora con un evento',b:'Innovation days, culture hackathons y jornadas\nde transformación que generan experiencias\ncompartidas y nuevos referentes culturales.\n\n→ Diseñemos vuestro evento de cultura.'},procesos:{h:'// SISTEMAS CULTURALES //',t:'Fomentar la cultura innovadora con procesos',b:'Diseñamos rituales, espacios y sistemas\nque refuerzan los comportamientos innovadores\ndía a día, más allá de los grandes eventos.\n\n→ Consulta nuestro modelo de cultura continua.'},cultura:{h:'// TRANSFORMACIÓN PROFUNDA //',t:'Fomentar la cultura innovadora cambiando la cultura',b:'Un programa integral de transformación cultural\ncon acompañamiento sostenido, medición de avances\ny construcción de comunidad interna de innovadores.\n\n→ Hablemos de tu proyecto de transformación.'}}};

const stg=document.querySelector('.stage');
Object.entries(cont).forEach(([verb,states])=>{Object.entries(states).forEach(([state,d])=>{
  const div=document.createElement('div');div.className='page';div.id=`page-${verb}-${state}`;
  div.innerHTML=`<div class="sh">${d.h}</div><div class="st">${d.t}</div><div class="sd"></div><div class="sb">${d.b.replace(/\n/g,'<br>')}</div><button class="bb" onclick="goBack()">◀ VOLVER AL INICIO</button>`;
  stg.appendChild(div);
})});
document.getElementById('btn-ej').addEventListener('click',()=>{
  const tg=document.getElementById(`page-${aV}-${aS}`);if(!tg)return;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));tg.classList.add('active');
});
function goBack(){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page-main').classList.add('active');}
